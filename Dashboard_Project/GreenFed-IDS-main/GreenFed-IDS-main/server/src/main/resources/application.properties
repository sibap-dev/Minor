
spring.application.name=greenfed-resource-monitor
server.port=4000

spring.datasource.url=jdbc:postgresql://localhost:5432/greenfed_monitor
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Local research workflow. Paths are auto-detected when left blank.
greenfed.python=${GREENFED_PYTHON:python}
greenfed.simulator-node=${GREENFED_SIMULATOR_NODE:node}
greenfed.simulator-api-url=${GREENFED_SIMULATOR_API_URL:http://127.0.0.1:4000}
greenfed.simulator-client-count=${SIMULATOR_CLIENT_COUNT:5}
greenfed.simulator-interval-ms=${COLLECTION_INTERVAL_MS:10000}
